<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Dar Aldawa Enterprise CMS</title>
  <meta name="description" content="Dar Aldawa Content Management System Login Portal.">
  
  <link rel="stylesheet" href="admin/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  
  <style>
    body.login-page, body.login-page * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body.login-page .material-symbols-outlined, 
    body.login-page [class*="material-symbols"] {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    body.login-page {
      background: linear-gradient(135deg, #0A192C 0%, #0D2137 50%, #112A46 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow rings */
    .login-ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 153, 122, 0.15) 0%, rgba(13, 33, 55, 0) 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .login-ambient-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(92, 225, 198, 0.1) 0%, rgba(13, 33, 55, 0) 70%);
      bottom: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      padding: 40px;
      position: relative;
      z-index: 10;
      animation: loginFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .login-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 0;
      box-shadow: none;
      margin-bottom: 4px;
    }

    .login-logo-wrap img {
      height: 58px;
      max-width: 230px;
      width: auto;
      object-fit: contain;
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: #0D2137;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .login-subtitle {
      font-size: 13.5px;
      color: #64748B;
      margin-top: -6px;
    }

    .login-form-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field-label {
      font-size: 13px;
      font-weight: 600;
      color: #0D2137;
    }

    .login-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-input-wrap .field-icon {
      position: absolute;
      left: 14px;
      color: #94A3B8;
      font-size: 19px;
      pointer-events: none;
    }

    .login-input-field {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #0D2137;
      outline: none;
      background: #FFFFFF;
      transition: all 0.2s ease;
    }

    .login-input-field:focus {
      border-color: #00997A;
      box-shadow: 0 0 0 3px rgba(0, 153, 122, 0.12);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-password-btn:hover {
      color: #00997A;
    }

    .login-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #64748B;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      color: #00997A;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: #00997A;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .btn-login-submit:hover {
      background: #008066;
      transform: translateY(-1px);
    }

    .login-error-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .login-error-banner.active {
      display: flex;
    }

    /* Quick Demo Login Preset */
    .quick-preset-wrap {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-preset-label {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preset-pill-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 12.5px;
      color: #0D2137;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-pill-btn:hover {
      background: #EBFDF9;
      border-color: #00997A;
      color: #00997A;
    }

    .back-public-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94A3B8;
      text-decoration: none;
      font-size: 13px;
      margin-top: 20px;
      justify-content: center;
      width: 100%;
      transition: color 0.15s;
    }

    .back-public-link:hover {
      color: #00997A;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-ambient-glow"></div>
  <div class="login-ambient-glow-2"></div>

  <div class="login-card-container">
    
    <!-- Brand Header -->
    <div class="login-brand-header">
      <div class="login-logo-wrap">
        <img src="images/logo.png" alt="Dar Aldawa - Trusted Quality">
      </div>
      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">Enter your credentials to manage website content</p>
    </div>

    <!-- Error Banner -->
    <div class="login-error-banner" id="loginErrorBanner">
      <span class="material-symbols-outlined" style="font-size: 18px;">error</span>
      <span id="loginErrorText">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="login-form-stack">
      <div class="login-field-group">
        <label class="login-field-label" for="usernameInput">Email or Username</label>
        <div class="login-input-wrap">
          <span class="material-symbols-outlined field-icon">mail</span>
          <input type="text" id="usernameInput" class="login-input-field" value="admin@dadgroup.com" placeholder="e.g. aseel.badran@dadgroup.com" required autocomplete="username">
        </div>
      </div>

      <div class="login-field-group">
        <label class="login-field-label" for="passwordInput">Password</label>
        <div class="login-input-wrap">
          <span class="material-symbols-outlined field-icon">lock</span>
          <input type="password" id="passwordInput" class="login-input-field" value="Admin@2026" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
          </button>
        </div>
      </div>

      <div class="login-options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMeCheckbox" checked>
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Please contact the IT Security Department at admin.dad@dadgroup.com to reset administrative credentials.'); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login-submit" id="submitLoginBtn">
        <span>Sign In to Dashboard</span>
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
      </button>
    </form>

    <!-- Quick Demo Preset -->
    <div class="quick-preset-wrap">
      <span class="quick-preset-label">Quick Demo Access</span>
      <button class="preset-pill-btn" onclick="fillCredentials('aseel.badran@dadgroup.com', 'Admin@2026')">
        <span><strong>Aseel Badran</strong> (Chief Administrator)</span>
        <span class="material-symbols-outlined" style="font-size: 16px;">login</span>
      </button>
    </div>

    <!-- Return Link -->
    <a href="index.html" class="back-public-link">
      <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
      <span>Return to Public Website</span>
    </a>

  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');
    const errorBanner = document.getElementById('loginErrorBanner');
    const errorText = document.getElementById('loginErrorText');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        togglePasswordIcon.textContent = 'visibility';
      }
    });

    function fillCredentials(user, pass) {
      usernameInput.value = user;
      passwordInput.value = pass;
      errorBanner.classList.remove('active');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = usernameInput.value.trim();
      const p = passwordInput.value;

      // Authentication logic
      if (u && p.length >= 4) {
        sessionStorage.setItem('dad_admin_session', JSON.stringify({
          user: 'Aseel Badran',
          role: 'Chief Administrator',
          email: u,
          loggedAt: new Date().toISOString()
        }));
        // Direct to admin dashboard
        window.location.href = 'admin/index.html';
      } else {
        errorText.textContent = 'Please provide valid administrative credentials.';
        errorBanner.classList.add('active');
      }
    });
  </script>
</body>
</html>
